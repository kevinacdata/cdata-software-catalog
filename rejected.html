<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CData Rejected Software</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6f8; color: #172b4d; min-height: 100vh; }
header { background: #000; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; }
header h1 { color: #fff; font-size: 18px; font-weight: 600; letter-spacing: -0.2px; }
.controls { display: flex; align-items: center; gap: 10px; padding: 16px 28px 12px; background: #fff; border-bottom: 1px solid #e3e6ea; flex-wrap: wrap; }
.search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 380px; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #8993a4; pointer-events: none; }
input[type="text"] { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid #dfe1e6; border-radius: 6px; font-size: 14px; color: #172b4d; background: #fafbfc; outline: none; }
input[type="text"]:focus { border-color: #4c9aff; box-shadow: 0 0 0 2px rgba(76,154,255,0.2); background: #fff; }
.count-badge { margin-left: auto; font-size: 13px; color: #5e6c84; white-space: nowrap; }
.link-btn { padding: 8px 16px; background: #0052cc; color: #fff; border-radius: 6px; font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.link-btn:hover { background: #0065ff; }
.note { padding: 12px 28px 0; font-size: 13px; color: #5e6c84; }
.table-wrap { padding: 16px 28px 32px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e3e6ea; font-size: 14px; }
thead tr { background: #f4f5f7; border-bottom: 2px solid #e3e6ea; }
th { padding: 10px 14px; text-align: left; font-size: 12px; font-weight: 600; color: #5e6c84; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { color: #172b4d; }
th.no-sort { cursor: default; }
th.no-sort:hover { color: #5e6c84; }
th .sort-icon { margin-left: 4px; opacity: 0.4; font-size: 10px; }
th.sorted .sort-icon { opacity: 1; color: #0052cc; }
td { padding: 11px 14px; border-bottom: 1px solid #f0f1f3; vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #f8f9ff; }
td.logo-cell { width: 48px; padding: 8px 4px 8px 14px; }
.app-logo { width: 32px; height: 32px; border-radius: 6px; object-fit: contain; display: block; background: #f4f5f7; }
.logo-fallback { width: 32px; height: 32px; border-radius: 6px; display: none; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; }
td.label-cell { font-weight: 500; }
td.label-cell a { color: #0052cc; text-decoration: none; }
td.label-cell a:hover { text-decoration: underline; }
td.desc-cell { color: #5e6c84; max-width: 300px; }
td.reason-cell { max-width: 320px; }
td.date-cell { white-space: nowrap; color: #5e6c84; }
.empty-state { text-align: center; padding: 60px 20px; color: #8993a4; }
#loading, #error { text-align: center; padding: 60px; color: #5e6c84; font-size: 15px; }
#error { color: #de350b; }
@media (max-width: 700px) { .controls { padding: 12px 16px; } .table-wrap { padding: 12px 16px 24px; } header { padding: 14px 16px; } td.desc-cell, th#th-description { display: none; } }
</style>
</head>
<body>
<header>
<div style="display:flex; align-items:center; gap:16px;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 346" height="26" style="color:#FFE500; flex-shrink:0;">
<path d="M597.62.95c95.21,0,172.33,77.21,172.33,172.33s-77.21,172.33-172.33,172.33h-188.9V.95h188.9ZM483.52,280.44h114.09c56.66,0,102.65-50.45,102.65-107.15s-45.95-107.33-102.65-107.33h-114.09v214.48Z" fill="currentColor"/>
<path d="M1167.43,345.61h-80.55l-21.47-65.18h-193.74l-21.19,65.18h-80.55L890.13.95h156.01l121.29,344.66ZM893.05,215.26h150.83l-49.11-149.31h-53.35l-48.37,149.31Z" fill="currentColor"/>
<path d="M1800,345.61h-80.55l-21.47-65.18h-193.74l-21.19,65.18h-80.55L1522.7.95h156.01l121.29,344.66ZM1525.62,215.26h150.83l-49.11-149.31h-53.35l-48.38,149.31Z" fill="currentColor"/>
<path d="M1450.82,65.95h-127.8v279.09h-75.91V65.95h-127.8V.38h331.5v65.57Z" fill="currentColor"/>
<path d="M167.19,65.96h177.65V.78H0v344.84h344.84v-65.18h-177.65c-59.24,0-107.24-48.02-107.24-107.24s48.01-107.24,107.24-107.24Z" fill="currentColor"/>
</svg>
<h1>Rejected Software</h1>
</div>
</header>
<div class="controls">
<div class="search-wrap">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
<input type="text" id="search" placeholder="Search by name, description, or reason..." oninput="applyFilters()">
</div>
<span class="count-badge" id="count"></span>
<a class="link-btn" href="index.html">Approved software ↗</a>
</div>
<p class="note">Software that has been requested and not approved for use at CData. Resubmit a request if your needs have changed.</p>
<div class="table-wrap">
<div id="loading">Loading list...</div>
<div id="error" style="display:none"></div>
<table id="list-table" style="display:none">
<thead><tr>
<th class="no-sort" style="width:48px;"></th>
<th onclick="sortBy('software name')" id="th-software-name">Software <span class="sort-icon">⇕</span></th>
<th class="no-sort" id="th-description">Description</th>
<th class="no-sort" id="th-reason">Reason</th>
<th onclick="sortBy('date rejected')" id="th-date-rejected">Date <span class="sort-icon">⇕</span></th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
<div class="empty-state" id="empty-state" style="display:none"><strong>No results found</strong><p>Try a different search term.</p></div>
</div>
<script>
let allRows=[],sortCol='',sortAsc=true;
const COLORS=['#0052cc','#00875a','#ff5630','#ff8b00','#6554c0','#00b8d9','#36b37e','#403294'];
function host(u){try{return new URL(u).hostname;}catch(e){return '';}}
function sortBy(col){
  if(sortCol===col){sortAsc=!sortAsc;}else{sortCol=col;sortAsc=(col==='software name');}
  document.querySelectorAll('th').forEach(t=>t.classList.remove('sorted'));
  const t=document.getElementById('th-'+col.replace(/ /g,'-'));
  if(t){t.classList.add('sorted');t.querySelector('.sort-icon').textContent=sortAsc?'↑':'↓';}
  applyFilters();
}
function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const f=allRows.filter(r=>!q||[r['software name'],r.description,r.reason].some(v=>(v||'').toLowerCase().includes(q)));
  f.sort((a,b)=>{const x=(a[sortCol]||'').toLowerCase(),y=(b[sortCol]||'').toLowerCase();return sortAsc?x.localeCompare(y):y.localeCompare(x);});
  const tbody=document.getElementById('tbody');tbody.innerHTML='';
  document.getElementById('count').textContent=f.length+' of '+allRows.length+' apps';
  document.getElementById('empty-state').style.display=f.length?'none':'block';
  document.getElementById('list-table').style.display=f.length?'':'none';
  f.forEach(r=>{
    const name=r['software name']||'—',wu=(r.website_url||'').trim(),h=host(wu);
    const tr=document.createElement('tr');
    const lc=document.createElement('td');lc.className='logo-cell';
    const letter=name[0].toUpperCase();
    const fb=document.createElement('div');fb.className='logo-fallback';fb.style.background=COLORS[letter.charCodeAt(0)%COLORS.length];fb.textContent=letter;
    if(h){
      const img=document.createElement('img');img.className='app-logo';img.alt='';
      img.src='https://www.google.com/s2/favicons?domain='+h+'&sz=128';
      img.onload=function(){if(this.naturalWidth<=16){this.style.display='none';fb.style.display='flex';}};
      img.onerror=function(){this.style.display='none';fb.style.display='flex';};
      lc.appendChild(img);
    }else{fb.style.display='flex';}
    lc.appendChild(fb);
    const nc=document.createElement('td');nc.className='label-cell';
    if(wu){const a=document.createElement('a');a.href=wu;a.target='_blank';a.rel='noopener noreferrer';a.textContent=name;nc.appendChild(a);}else{nc.textContent=name;}
    const dc=document.createElement('td');dc.className='desc-cell';dc.textContent=r.description||'—';
    const rc=document.createElement('td');rc.className='reason-cell';rc.textContent=r.reason||'—';
    const tc=document.createElement('td');tc.className='date-cell';tc.textContent=r['date rejected']||'—';
    [lc,nc,dc,rc,tc].forEach(c=>tr.appendChild(c));
    tbody.appendChild(tr);
  });
}
Papa.parse('rejected.csv',{download:true,header:true,skipEmptyLines:true,transformHeader:h=>h.trim().toLowerCase(),
  complete(res){document.getElementById('loading').style.display='none';allRows=res.data;sortBy('software name');},
  error(){document.getElementById('loading').style.display='none';const e=document.getElementById('error');e.style.display='block';e.textContent='Could not load the list.';}
});
</script>
</body>
</html>
