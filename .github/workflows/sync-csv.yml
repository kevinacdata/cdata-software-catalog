name: Sync CSV from Google Drive

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download CSV from Google Drive
        run: |
          curl -L "https://drive.google.com/uc?export=download&id=17zXJE5G3sVVD8nAvfQXRpNk8Jn4Oim5m" -o data_new.csv

      - name: Check for changes and commit
        run: |
          if ! diff -q data.csv data_new.csv > /dev/null 2>&1; then
            mv data_new.csv data.csv
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.csv
            git commit -m "Auto-sync data.csv from Google Drive"
            git push
          else
            echo "No changes detected, skipping commit."
          fi
