name: Sync CSV from Google Drive

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download CSV from Google Drive
        run: |
          curl -L "https://drive.google.com/uc?export=download&id=17zXJE5G3sVVD8nAvfQXRpNk8Jn4Oim5m" -o data.csv

      - name: Commit if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.csv
          git diff --staged --quiet || git commit -m "Auto-sync data.csv from Google Drive"
          git push
